
name: Update SnowHybrid + ECMWF + ICON-D2 maps (hourly)

# cron-job.org triggers this using POST /actions/workflows/update.yml/dispatches.
# Keep this workflow_dispatch trigger. No duplicate GitHub schedule is needed.
on:
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Check Python scripts and libraries only; no model downloads'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: snowhybrid-ecmwf-icon-d2-pages-v4
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    env:
      # Same dark/slate display for all three models; other options:
      # graphite, night, ice. No impact on model calculations.
      SNOW_MAP_THEME: 'slate'

      # Hybrid: 48 h, 3-hour intervals, 6 models.
      HYBRID_GRID_STEP: '0.008'
      HYBRID_DPI: '200'
      HYBRID_MIN_MODELS: '2'
      HYBRID_ESRI_RELIEF: '1'

      # Standalone ECMWF: 24-hour model-age limit retained; Alps only.
      ECMWF_AREAS: 'alps'
      ECMWF_N_DAYS: '7'
      ECMWF_GRID_STEP_ALPS: '0.008'
      ECMWF_GRID_STEP_FULL: '0.016'
      ECMWF_DPI: '200'
      ECMWF_MAX_RUN_AGE_H: '24'
      ECMWF_ESRI_RELIEF: '1'

      # Standalone ICON-D2: snowfall per local day, cumulative snowfall,
      # snowline and freezing-level maps (6 h), up to +48 h. Alps only.
      ICON_D2_AREAS: 'alps'
      ICON_D2_DPI: '200'
      ICON_D2_GRID_STEP_ALPS: '0.008'
      ICON_D2_GRID_STEP_FULL: '0.012'
      ICON_D2_ESRI_RELIEF: '1'
      ICON_D2_MAX_RUN_AGE_H: '24'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install geospatial libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev libgeos-dev libproj-dev

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'cfgrib>=0.9.14,<1'

      - name: Check all scripts and libraries
        run: python run_forecast.py --check

      - name: Verify dark map layout imports
        run: |
          python -m py_compile map_style_reference.py snow_dark_adapter.py
          python - <<'PYCODE'
          import map_style_reference as design
          import snow_dark_adapter as adapter
          assert design.RELIEF_THEME == 'slate'
          print('Dark/slate map layout installed for all model panels')
          PYCODE

      - name: Generate Hybrid, ECMWF and ICON-D2 maps and website
        if: inputs.check_only != true
        run: python run_forecast.py

      - name: Validate website before deployment
        if: inputs.check_only != true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('site/status.json')
          if not p.is_file():
              raise SystemExit('No website status.json was generated')
          status = json.loads(p.read_text(encoding='utf-8'))
          for model in ('hybrid', 'ecmwf', 'icon_d2'):
              entry = status['models'][model]
              print(f"{model}: {entry['status']}, {entry['map_count']} maps")
          for model in ('hybrid', 'ecmwf'):
              if status['models'][model]['status'] != 'ok':
                  raise SystemExit(f'Existing {model} forecast failed; preserving previous website')
          if status['models']['icon_d2']['status'] != 'ok':
              print('::warning::ICON-D2 failed; only Hybrid and ECMWF will be updated')
          PY
          du -sh site

      - name: Configure Pages
        if: inputs.check_only != true
        uses: actions/configure-pages@v5

      - name: Upload current website
        if: inputs.check_only != true
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish website
        if: inputs.check_only != true
        id: deploy
        uses: actions/deploy-pages@v4

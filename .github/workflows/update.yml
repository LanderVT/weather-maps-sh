
name: Update SnowHybrid + ECMWF maps (hourly)

on:
  schedule:
    - cron: '37 * * * *'

  workflow_dispatch:
    inputs:
      check_only:
        description: 'Only check scripts and dependencies (no downloads or website update)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: snowhybrid-ecmwf-pages-v3
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    env:
      # Hybrid Model: 6 modellen, 48 uur
      HYBRID_GRID_STEP: '0.008'
      HYBRID_DPI: '200'
      HYBRID_MIN_MODELS: '2'
      HYBRID_ESRI_RELIEF: '1'

      # ECMWF Model: afzonderlijke 7-daagse verwachting
      ECMWF_AREAS: 'alps'
      ECMWF_N_DAYS: '7'
      ECMWF_GRID_STEP_ALPS: '0.008'
      ECMWF_GRID_STEP_FULL: '0.016'
      ECMWF_DPI: '200'
      ECMWF_ESRI_RELIEF: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install geospatial libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev libgeos-dev libproj-dev

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check eight scripts and libraries
        run: python run_forecast.py --check

      - name: Generate Hybrid + standalone ECMWF maps and website
        if: inputs.check_only != true
        run: python run_forecast.py

      - name: Configure Pages
        if: inputs.check_only != true
        uses: actions/configure-pages@v5

      - name: Upload current website
        if: inputs.check_only != true
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish website
        if: inputs.check_only != true
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Check both forecasts completed
        if: inputs.check_only != true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('site/status.json')

          if not p.is_file():
              raise SystemExit('No website status file')

          status = json.loads(p.read_text(encoding='utf-8'))

          if status.get('status') != 'ok':
              raise SystemExit('One or both forecasts failed; see logs')

          print('Hybrid and ECMWF forecasts published successfully')
          PY

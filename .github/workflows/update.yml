name: Update SnowHybrid maps (hourly)

on:
  schedule:
    - cron: '00 * * * *'

  workflow_dispatch:
    inputs:
      check_only:
        description: 'Only check Python dependencies (no downloads or website update)'
        required: false
        type: boolean
        default: false

  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/update.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: snowhybrid-pages-v2
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    env:
      HYBRID_GRID_STEP: '0.008'
      HYBRID_DPI: '200'
      HYBRID_MIN_MODELS: '2'
      HYBRID_ESRI_RELIEF: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install geospatial libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev libgeos-dev libproj-dev

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check all seven scripts and libraries
        run: python run_forecast.py --check

      - name: Generate fresh maps and website
        if: github.event_name != 'push' && inputs.check_only != true
        run: python run_forecast.py

      - name: Configure Pages
        if: github.event_name != 'push' && inputs.check_only != true
        uses: actions/configure-pages@v5

      - name: Upload only current maps
        if: github.event_name != 'push' && inputs.check_only != true
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish website
        if: github.event_name != 'push' && inputs.check_only != true
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Fail workflow if no new forecast was produced
        if: github.event_name != 'push' && inputs.check_only != true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('site/status.json')

          if not p.is_file() or json.loads(
              p.read_text(encoding='utf-8')
          ).get('status') != 'ok':
              raise SystemExit(
                  'Failed forecast: see logs.'
              )

          print('Success: latest forecast was published.')
          PY


name: Update SnowHybrid + ECMWF + ICON-D2 + ICON-CH2 maps (hourly)

# cron-job.org triggers POST /actions/workflows/update.yml/dispatches.
# Keep workflow_dispatch; no duplicate GitHub schedule is required.
on:
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Check Python scripts and libraries only; no model downloads'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: snowhybrid-ecmwf-icon-d2-icon-ch2-pages-v5
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    env:
      SNOW_MAP_THEME: 'slate'

      # Hybrid: 48 h, 3-hour intervals, 6 models.
      HYBRID_GRID_STEP: '0.008'
      HYBRID_DPI: '200'
      HYBRID_MIN_MODELS: '2'
      HYBRID_ESRI_RELIEF: '1'

      # ECMWF: Alps + compact Benelux / medium mountains region.
      ECMWF_AREAS: 'alps'
      ECMWF_N_DAYS: '7'
      ECMWF_GRID_STEP_ALPS: '0.008'
      ECMWF_GRID_STEP_FULL: '0.01'
      ECMWF_DPI: '200'
      ECMWF_MAX_RUN_AGE_H: '24'
      ECMWF_ESRI_RELIEF: '1'

      # Standalone ICON-D2: Alps only.
      ICON_D2_AREAS: 'alps'
      ICON_D2_DPI: '200'
      ICON_D2_GRID_STEP_ALPS: '0.008'
      ICON_D2_GRID_STEP_FULL: '0.012'
      ICON_D2_ESRI_RELIEF: '1'
      ICON_D2_MAX_RUN_AGE_H: '24'

      # Standalone ICON-CH2-EPS control run: Alps, 5 days.
      ICON_CH2_DAYS: '5'
      ICON_CH2_STEP_HOURS: '6'
      ICON_CH2_GRID_STEP_ALPS: '0.012'
      ICON_CH2_DPI: '200'
      ICON_CH2_MAX_RUN_AGE_H: '24'
      ICON_CH2_ESRI_RELIEF: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # No apt-get: Python wheels include native geospatial libraries.
      - name: Install Python and geospatial libraries (no apt-get)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements.txt
          python -m pip install --only-binary=:all: \
            'eccodes>=2.43' \
            'eccodeslib>=2.43' \
            'cfgrib>=0.9.14,<1' \
            'Pillow>=10' \
            cartopy pyproj shapely

          python - <<'PY'
          import eccodes
          import cfgrib
          import cartopy
          import pyproj
          import shapely
          from PIL import Image

          print(
              'Python wheels: ecCodes, cfgrib, Cartopy, '
              'PROJ, GEOS and Pillow OK'
          )
          print('ecCodes API:', eccodes.codes_get_api_version())
          PY

      - name: Check all scripts and libraries
        run: python run_forecast.py --check

      - name: Verify dark map layout imports
        run: |
          python -m py_compile map_style_reference.py snow_dark_adapter.py

          python - <<'PYCODE'
          import map_style_reference as design
          import snow_dark_adapter as adapter

          assert design.RELIEF_THEME == 'slate'
          print('Dark/slate map layout installed for all model panels')
          PYCODE

      - name: Generate Hybrid, ECMWF, ICON-D2 and ICON-CH2 maps and website
        if: inputs.check_only != true
        run: python run_forecast.py

      - name: Validate website before deployment
        if: inputs.check_only != true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('site/status.json')

          if not p.is_file():
              raise SystemExit('No website status.json was generated')

          status = json.loads(p.read_text(encoding='utf-8'))

          for model in ('hybrid', 'ecmwf', 'icon_d2', 'icon_ch2'):
              entry = status['models'][model]
              print(
                  f"{model}: {entry['status']}, "
                  f"{entry['map_count']} maps"
              )

          for model in ('hybrid', 'ecmwf'):
              if status['models'][model]['status'] != 'ok':
                  raise SystemExit(
                      f'Existing {model} forecast failed; '
                      f'preserving previous website'
                  )

          if status['models']['icon_d2']['status'] != 'ok':
              print(
                  '::warning::ICON-D2 failed; '
                  'only Hybrid and ECMWF will be updated'
              )

          if status['models']['icon_ch2']['status'] != 'ok':
              print(
                  '::warning::ICON-CH2 failed; '
                  'existing model tabs remain available'
              )
          PY

          du -sh site

      # Optional high-quality PNG optimizer, installed through pip.
      - name: Install optional high-quality PNG optimizer
        if: inputs.check_only != true
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python -m pip install --only-binary=:all: 'imagequant>=1.1.4,<2'

      # Compress PNGs in the finished site directory.
      # If imagequant is unavailable, use Pillow.
      # A compression failure must never block publication.
      - name: Compress website PNG maps (optional, safe)
        if: inputs.check_only != true
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          try:
              import imagequant
              engine = 'imagequant (80-95 quality)'
          except ImportError:
              imagequant = None
              engine = 'Pillow fallback (256 colors)'

          site = Path('site')

          if not site.is_dir():
              print(
                  '::warning::No site directory; '
                  'skipping PNG optimization'
              )
              raise SystemExit(0)

          files = sorted(site.rglob('*.png'))

          # Only compress PNG files larger than 1 MiB.
          threshold = 1 * 1024 * 1024

          before_total = 0
          after_total = 0
          optimized = 0
          skipped = 0
          failed = 0

          print()
          print('========================================')
          print(' PNG OPTIMIZATION')
          print('========================================')
          print('Optimizer:', engine)
          print('PNG files found:', len(files))
          print()

          for path in files:

              before = path.stat().st_size
              before_total += before

              if before < threshold:
                  after_total += before
                  skipped += 1
                  continue

              temporary = path.with_name(
                  path.name + '.optimizing.png'
              )

              try:
                  with Image.open(path) as original:

                      dimensions = original.size

                      if original.mode in ('P', 'L', '1'):
                          # Re-encode indexed/grayscale files losslessly.
                          result = original.copy()

                      elif imagequant is not None:
                          # High-quality palette optimization.
                          result = imagequant.quantize_pil_image(
                              original.convert('RGBA'),
                              dithering_level=0.7,
                              max_colors=256,
                              min_quality=80,
                              max_quality=95,
                          )

                      else:
                          # Pillow fallback if imagequant is unavailable.
                          rgba = original.convert('RGBA')
                          result = rgba.quantize(
                              colors=256,
                              method=Image.Quantize.FASTOCTREE,
                          )

                      result.save(
                          temporary,
                          format='PNG',
                          optimize=True
                      )
                      result.close()

                  # Check the optimized PNG before replacing anything.
                  with Image.open(temporary) as check:
                      check.verify()

                  with Image.open(temporary) as check:
                      if check.size != dimensions:
                          raise RuntimeError(
                              'Image dimensions changed'
                          )

                  after = temporary.stat().st_size

                  if after < before:

                      # Replace the original only when the new file
                      # is valid and actually smaller.
                      temporary.replace(path)
                      optimized += 1

                      reduction = (
                          100 * (before - after) / before
                      )

                      print(
                          f'{path.name}: '
                          f'{before / 1048576:.2f} -> '
                          f'{after / 1048576:.2f} MiB '
                          f'(-{reduction:.0f}%)'
                      )

                  else:
                      temporary.unlink()
                      skipped += 1

              except Exception as exc:

                  failed += 1
                  print(
                      f'::warning::PNG unchanged: '
                      f'{path.name}: {exc}'
                  )

              finally:
                  temporary.unlink(missing_ok=True)

              after_total += path.stat().st_size

          print()
          print('========================================')
          print(' PNG COMPRESSION SUMMARY')
          print('========================================')

          print(f'Optimized: {optimized}')
          print(f'Skipped:   {skipped}')
          print(f'Failed:    {failed}')

          print(
              f'Before: {before_total / 1048576:.1f} MiB'
          )
          print(
              f'After:  {after_total / 1048576:.1f} MiB'
          )
          print(
              f'Saved:  '
              f'{(before_total - after_total) / 1048576:.1f} MiB'
          )

          if before_total:
              print(
                  f'Total reduction: '
                  f'{100 * (before_total - after_total) / before_total:.1f}%'
              )
          PY

          du -sh site

      - name: Configure Pages
        if: inputs.check_only != true
        uses: actions/configure-pages@v5

      - name: Upload current website
        if: inputs.check_only != true
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish website
        if: inputs.check_only != true
        id: deploy
        uses: actions/deploy-pages@v4
